# Optional: Tijori under scale0 (github.com/jblaze2908/scale0), a scale-to-zero tool whose deployer replaces
# pull-update.sh. Unused without it. The api sleeps when idle; `health` is the address scale0 holds, which wakes it.
# migrate isn't listed: `up worker` runs it first (depends_on), and every wake of the api runs it again.
[app]
compose = deploy/compose.yml
project = tijori
env_file = /etc/tijori/tijori.env
branch = main
key = /root/.ssh/tijori_deploy
health = http://172.17.0.1:8310/health
backup = pg_dump:db
notify = NTFY_URL NTFY_OPS_TOKEN tijori-ops

[service.db]
mode = always

[service.worker]
mode = always

[service.api]
mode = sleep
scale0 = tijori
